name: PR Summary Generator

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Summary with Gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. PR의 코드 변경점 추출
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD | head -n 3000)

          if [ -z "$DIFF" ]; then
            echo "No code changes detected."
            exit 0
          fi

          # 2. 한국어 프롬프트 구성
          PROMPT="당신은 시니어 개발자입니다. 아래 PR diff를 읽고 깔끔하게 한국어로 요약 코멘트를 작성해주세요.
          인사말이나 부연 설명, 서두 문장(예: '시니어 개발자 관점에서...', '요약 내용입니다' 등)은 일절 포함하지 말고, 반드시 아래 템플릿의 첫 번째 줄(### 📋 변경 요약)부터 바로 시작하세요.

          ### 📋 변경 요약
          - 핵심 요약 (1~2줄)
          - 주요 변경 사항 (불릿 포인트)

          [Git Diff]
          $DIFF"

          JSON_PAYLOAD=$(jq -n --arg text "$PROMPT" '{
            contents: [{ parts: [{ text: $text }] }]
          }')

          # 3. Gemini API 호출 함수 정의 (curl 자동 재시도 포함)
          call_gemini() {
            local model="$1"
            local url="https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}"
            curl -s -X POST "$url" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD" \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors
          }

          # 1차 시도: 최신 표준 모델 gemini-3.8-flash
          RESPONSE=$(call_gemini "gemini-3.8-flash")
          SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          # 2차 시도: 일시적 과부하(503) 등으로 실패 시 gemini-3.5-flash-lite로 Fallback
          if [ -z "$SUMMARY" ]; then
            echo "gemini-3.8-flash 응답 지연/실패. gemini-3.5-flash-lite로 재시도합니다."
            RESPONSE=$(call_gemini "gemini-3.5-flash-lite")
            SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          fi

          # 4. 응답 본문 파싱 및 예외 처리 (API 실패 시에도 CI 전체가 깨지지 않도록 경고만 출력)
          if [ -z "$SUMMARY" ]; then
            echo "::warning::Gemini API 요약 생성 실패 (응답: $RESPONSE)"
            exit 0
          fi

          # 5. PR 코멘트 등록
          COMMENT_BODY="### 🤖 AI PR 요약

          $SUMMARY"

          gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"